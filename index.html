<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hej Danmark">
<title>Hej Danmark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a winding lesson path on one phone column, a bottom tab bar, a full-screen lesson player.
   Look: a dark ground (bright screens give the player headaches) with vivid color on top, one strong color per unit. Dark only. */
:root{
  color-scheme:dark;
  --bg:#0f1424; --surface:#1a2238; --raised:#27324f; --line:#34416a; --ledge:#080b16;
  --fg:#f4f1ea; --muted:#9aa4bf; --ink:#1a1405;
  --candle:#ffd23f; --candle-d:#c79a12; --red:#ff5a6e; --blue:#4d8dff; --blue-d:#2b5fc7;
  --good:#5fe39a; --good-d:#2a9c62; --good-bg:#143a2c;
  --miss:#ff7a85; --miss-d:#c2414f; --miss-bg:#3d1a26;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);overscroll-behavior-y:none;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:14px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* pressable 3D things */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;background:var(--candle);color:var(--ink);font-family:var(--display);font-weight:600;font-size:18px;text-align:center;
  box-shadow:0 5px 0 var(--candle-d);transition:transform .07s,box-shadow .07s;margin-bottom:5px}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--candle-d)}
.btn:disabled{background:var(--raised);color:var(--muted);box-shadow:0 5px 0 var(--ledge)}
.btn.ghost{background:var(--raised);color:var(--fg);box-shadow:0 5px 0 var(--ledge)}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.btn.miss{background:var(--miss);box-shadow:0 5px 0 var(--miss-d)}
.btn.sm{width:auto;padding:9px 15px;font-size:15px;border-radius:13px;box-shadow:0 4px 0 var(--ledge);margin-bottom:4px}
.btn.sm:active{transform:translateY(4px);box-shadow:0 0 0 var(--ledge)}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:6px;align-self:center}

/* home top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;gap:8px;justify-content:space-between;padding-block:6px}
.chip{flex:1;justify-content:center;white-space:nowrap;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 8px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;gap:5px;align-items:center}
.chip small{font-family:var(--body);font-weight:700;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.chip .fl{display:inline-block}
.chip.lit .fl{animation:flick 1.2s ease-in-out infinite}
.chip.cold .fl{filter:grayscale(1);opacity:.6}
.quests{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.quests h3{font-size:16px;display:flex;justify-content:space-between}
.quests h3 span{color:var(--muted);font-family:var(--body);font-size:13px;font-weight:700}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;font-weight:700;align-items:center}
.q .bar{grid-column:1/-1;height:10px;border-radius:9px;background:var(--raised);overflow:hidden}
.q .bar i{display:block;height:100%;border-radius:9px;background:var(--candle);transition:width .5s}
.q.done{color:var(--good)} .q.done .bar i{background:var(--good)}
.note{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:12px 14px;color:var(--muted);font-size:14px}

/* path */
.banner{border-radius:20px;padding:14px 16px;background:var(--c);color:var(--ink);box-shadow:0 5px 0 var(--cl);display:flex;flex-direction:column}
.banner small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.75}
.banner h2{font-size:22px} .banner span{font-weight:700;font-size:14px;opacity:.8}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:22px 10px}
.nw{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:8px}
.node{width:78px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 8px 0 var(--cl);font-size:32px;display:grid;place-items:center;transition:transform .07s,box-shadow .07s;position:relative}
.node:active{transform:translateY(8px);box-shadow:0 0 0 var(--cl)}
.node.locked{background:#2a3548;box-shadow:0 8px 0 #1a2231}
.node.locked span{filter:grayscale(1);opacity:.4}
.node.next::before{content:"";position:absolute;inset:-9px -9px -15px;border-radius:50%;border:4px solid var(--c);opacity:.5;animation:ring 1.6s ease-in-out infinite}
.nl{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted)}
.nw.cur .nl{color:var(--fg)}
.nst{color:var(--candle);font-size:13px;letter-spacing:2px;line-height:1}
.startb{position:absolute;top:-40px;background:var(--surface);border:2px solid var(--line);color:var(--c);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;padding:5px 12px;border-radius:12px;animation:bounce 1.3s ease-in-out infinite;z-index:1}
.startb::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.buddy{position:absolute;top:-8px;width:104px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.buddy.r{left:calc(100% + 6px)} .buddy.l{right:calc(100% + 6px)}
.buddy.l .snegl{transform:scaleX(-1)}
.say{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:5px 10px;font-family:var(--display);font-weight:600;font-size:14px;text-align:center;line-height:1.2;animation:pop .4s both}
.say small{display:block;font-family:var(--body);color:var(--muted);font-size:11px;font-weight:700}

/* mascot */
.snegl{width:100%;height:auto;display:block;animation:bob 2.6s ease-in-out infinite}
.snegl .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.snegl.yay{animation:hop .55s ease-out 3}
.snegl.oops{animation:droop .5s both}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,9,15,.6);z-index:6;animation:fade .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-radius:26px 26px 0 0;border-top:4px solid var(--c);
  padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.2) both}
.sheet>div{max-width:444px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sheet .big{font-size:52px;animation:pop .4s .1s both}
.sheet h2{font-size:26px} .sheet p{color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0e141f;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:9px 4px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button i{font-style:normal;font-size:23px;filter:grayscale(.7);transition:transform .2s}
.tabs button.on{color:var(--candle)} .tabs button.on i{filter:none;transform:translateY(-3px) scale(1.15)}

/* other tabs */
.hello h1{font-size:28px} .hello p{color:var(--muted)}
.unit{display:flex;flex-direction:column;gap:10px}
.unit-h{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.unit-h h2{font-size:20px} .unit-h span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0;box-shadow:0 4px 0 var(--ledge)}
.tile i{font-style:normal;font-size:34px}
.tile.own i{animation:wig 3s ease-in-out infinite}
.tile b{font-size:13px;line-height:1.2} .tile small{color:var(--muted);font-size:12px;line-height:1.25}
.tile.off i{filter:grayscale(1);opacity:.3} .tile.off b{color:var(--muted)}
.tile.buy{border-color:var(--candle)} .tile.buy:active{transform:translateY(4px);box-shadow:none}
.tile.new{animation:pop .5s both}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.row .tx{flex:1;min-width:0} .row b{display:block} .row span{color:var(--muted);font-size:14px}
.round{width:42px;height:42px;border-radius:50%;background:var(--raised);font-size:18px;flex:none;box-shadow:0 3px 0 var(--ledge)}
.round:active{transform:translateY(3px);box-shadow:none}
.round.on{background:var(--candle);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.row.you{border-color:var(--candle)}
.rk{font-size:26px;width:36px;text-align:center;flex:none;font-family:var(--display);font-weight:700;color:var(--muted)}
.pts{font-family:var(--display);font-weight:700;font-size:22px;color:var(--candle);flex:none;text-align:right}
.pts small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fbar{height:8px;border-radius:8px;background:var(--raised);overflow:hidden;margin-top:6px}
.fbar i{display:block;height:100%;background:var(--candle);border-radius:8px;transition:width .6s}
.welcome{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center}
.welcome .m{width:150px;margin:0 auto}
.codein{text-align:center;font-family:var(--display);font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.err{color:var(--miss);font-weight:700;font-size:14px;text-align:center}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
textarea{resize:vertical;min-height:130px;line-height:1.4;width:100%}
textarea:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
.tipline{color:var(--muted);font-size:13px;margin-top:-10px}
.shot{width:100%;max-height:190px;object-fit:cover;object-position:center 28%;border-radius:16px;filter:brightness(.82)}
.pc{background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--ledge)}
.pc img{width:100%;max-height:52vh;object-fit:cover;object-position:center 28%;filter:brightness(.82)}
.pct{padding:14px 16px 6px;display:flex;flex-direction:column;gap:4px}
.pct b{font-family:var(--display);font-size:22px}
.pc small{padding:0 16px 12px;color:var(--muted);font-size:11px}
.love{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#38222e;border:2px solid #b3577a;border-radius:18px;padding:12px 14px;animation:pop .5s .6s both}
.love i{font-style:normal;font-size:30px}
.love span{display:flex;flex-direction:column;min-width:0}
.love small{color:#e0a0b6;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.love b{font-family:var(--display);font-size:19px}
.love em{font-style:normal;color:var(--muted);font-size:14px}
.rvb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--ledge)}
.rvb:active{transform:translateY(4px);box-shadow:none}
.rvb.hot{border-color:var(--candle)}
.rvb i{font-style:normal;font-size:28px}
.rvb span{flex:1;display:flex;flex-direction:column;min-width:0}
.rvb b{font-family:var(--display);font-size:18px}
.rvb small{color:var(--muted);font-size:13px}
.rvb em{font-style:normal;font-weight:700;color:var(--candle);font-size:13px;flex:none}
.quests{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:12px 14px}
.quests h3{grid-column:1/-1;font-size:15px}
.q{font-size:12.5px;gap:3px 6px} .q .bar{height:6px}
#tkin{width:100%}
.note.go{border-style:solid;border-color:var(--candle);display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.note.go span{color:var(--muted)} .note.go .acts{justify-content:flex-start;margin-top:4px}
.prize{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--candle);border-radius:18px;padding:12px 14px}
.prize i{font-style:normal;font-size:30px}
.prize small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.prize b{font-family:var(--display);font-size:18px}
.coach{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.coach span,.coach p{color:var(--muted);font-size:14px} .coach p i{color:var(--candle);font-style:normal;font-weight:700}
details.rev{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
details.rev summary{font-weight:700;cursor:pointer}
.rv1{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
.rv1 span{color:var(--muted);font-size:13px} .rv1 input{padding:8px;font-size:14px}

/* lesson player */
.player{flex:1;display:flex;flex-direction:column;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{display:flex;align-items:center;gap:10px;padding-block:12px}
.pbar .x{font-size:20px;color:var(--muted);width:34px;height:34px}
.track{flex:1;height:14px;border-radius:9px;background:var(--raised);overflow:hidden}
.track div{height:100%;background:var(--candle);border-radius:9px;transition:width .45s cubic-bezier(.3,1.4,.5,1);position:relative}
.track div::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.28)}
.cmb{font-family:var(--display);font-weight:700;color:var(--candle);min-width:44px;text-align:right}
.cmb.bump{animation:pop .35s}
.step{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:6px 16px;animation:slide .32s cubic-bezier(.2,.8,.3,1) both}
.step>*{animation:rise .35s both} .step>*:nth-child(2){animation-delay:.05s} .step>*:nth-child(3){animation-delay:.1s} .step>*:nth-child(4){animation-delay:.15s}
.ask{font-family:var(--display);font-weight:600;font-size:21px}
.teach{display:flex;align-items:flex-end;gap:6px}
.teach .m{width:92px;flex:none}
.bub{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 4px 0 var(--ledge)}
.bub:active{transform:translateY(2px)}
.da{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;overflow-wrap:anywhere}
.hint{color:var(--candle);font-weight:700;font-size:15px}
.en{font-size:17px}
.tip{background:var(--raised);border-radius:14px;padding:10px 14px;color:var(--fg);font-size:14px}
.tip b{color:var(--candle)}
.ag{color:var(--muted);font-weight:400}
.atext p{margin:0 0 14px;font-size:18px;line-height:1.7}
.wd{cursor:pointer;border-radius:5px}
.wd.on{background:var(--candle);color:var(--ink);padding:0 2px}
.astrip{position:fixed;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border:2px solid var(--candle);border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 var(--ledge)}
.astrip .tx{flex:1;min-width:0}
.astrip small{display:block;color:var(--good);font-size:12px;font-weight:700}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;box-shadow:0 4px 0 var(--ledge)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bigplay{width:104px;height:98px;border-radius:28px;background:#5d8fd0;box-shadow:0 7px 0 #3d659b;font-size:42px;margin:2px auto 8px;color:var(--ink)}
.bigplay:active{transform:translateY(7px);box-shadow:none}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-size:17px;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .07s,box-shadow .07s;margin-bottom:4px;animation:rise .3s both}
.opts .opt:nth-child(2){animation-delay:.05s}.opts .opt:nth-child(3){animation-delay:.1s}.opts .opt:nth-child(4){animation-delay:.15s}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good-d);color:var(--good)}
.opt.no{border-color:var(--miss);background:var(--miss-bg);box-shadow:0 4px 0 var(--miss-d);color:var(--miss)}
.opt.sel{border-color:#5d8fd0;box-shadow:0 4px 0 #3d659b;background:#1d2c44}
.opt.gone{opacity:.25;border-color:var(--good);box-shadow:none;transform:scale(.96)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .opt{text-align:center;padding:14px 8px;font-size:16px;min-width:0;overflow-wrap:anywhere;min-height:60px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .btn{font-size:22px;padding:18px}
.answer{min-height:60px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.word{background:var(--surface);border:2px solid var(--line);border-radius:13px;padding:9px 14px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--line);margin-bottom:4px;animation:pop .22s both}
.word:active{transform:translateY(4px);box-shadow:none}
.word.used{opacity:.15;box-shadow:none}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-weight:700;animation:pop .3s both}
.msg small{display:block;font-weight:600;opacity:.75;font-size:13px}
.msg.k{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:#2c4a73;border-bottom-right-radius:6px}
.who{display:flex;align-items:flex-end;gap:6px} .who .m{width:54px;flex:none}
.mic{width:96px;height:90px;border-radius:50%;background:#5d8fd0;box-shadow:0 7px 0 #3d659b;color:var(--ink);font-size:40px;margin:2px auto 8px;display:block;position:relative}
.mic:active{transform:translateY(7px);box-shadow:none}
.mic.live{background:var(--miss);box-shadow:0 7px 0 var(--miss-d)}
.mic.live::before,.mic.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--miss);animation:wave 1.3s ease-out infinite}
.mic.live::after{animation-delay:.65s}
.spk{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.heard{color:var(--muted);font-size:15px;font-weight:600}

let NAME='Ciera';try{NAME=JSON.parse(localStorage.getItem('hejciera.v1')||'{}').name||'Ciera'}catch(e){}
const nm=t=>t.replace('{name}',NAME);
/* The first twelve lessons are keyed by their order (0 to 11) because saved progress uses those; everything newer carries its own key. */
const PH={};let plain=0;
L.forEach(l=>{l.key=l.key||String(plain++);l.p=(l.p||[]).map((a,pi)=>PH[l.key+'-'+pi]={id:l.key+'-'+pi,da:nm(a[0]),en:nm(a[1]),say:a[2],note:a[3]||''});l.d=(l.d||[]).map(d=>[nm(d[0]),nm(d[1]),d[2]]);
  l.mix=(l.mix||[]).map((a,mi)=>PH[l.key+'-m'+mi]={id:l.key+'-m'+mi,da:a[0],en:a[1],say:'',note:'',mix:true})});

/* Lessons the family made from real moments arrive from the sync service and sit after the course lessons. */
const CORE=L.length,PATH=L.map((l,i)=>i).sort((a,b)=>L[a].u-L[b].u||a-b);
const NU=UNITS.length;let PACK=null,famList=[];
const PKC=[{c:'#ff6fae',cl:'#c2417c'},{c:'#ffb23f',cl:'#c47f14'},{c:'#ff5a6e',cl:'#c2313f'},{c:'#c77dff',cl:'#8a48c2'}];
try{PACK=JSON.parse(localStorage.getItem('hejciera.v1')||'{}').pack||null}catch(e){}
function addPack(){
  if(!PACK||!PACK.lessons)return;
  (PACK.units||[]).forEach((u,i)=>UNITS.push(Object.assign({pk:true},u,PKC[i%PKC.length])));
  PACK.lessons.forEach(x=>{const l={u:NU+(x.u||0),pk:true,stamp:x.stamp||'',at:x.at||0,key:x.key,t:x.t,en:x.en,i:x.i,cards:x.cards||[],d:x.d||[]};
    l.p=(x.p||[]).map((a,pi)=>PH[x.key+'-'+pi]={id:x.key+'-'+pi,da:a[0],en:a[1],say:a[2]||'',note:a[3]||''});
    l.mix=(x.mix||[]).map((a,mi)=>PH[x.key+'-m'+mi]={id:x.key+'-m'+mi,da:a[0],en:a[1],say:'',note:'',mix:true});L.push(l)});
  Object.keys(PACK.core||{}).forEach(k=>{const l=L.slice(0,CORE).find(q=>q.key===k),x=PACK.core[k];if(!l)return;
    l.cards=x.cards||[];l.p=l.bp.concat((x.p||[]).map((a,i)=>PH[k+'-px'+i]={id:k+'-px'+i,da:a[0],en:a[1],say:a[2]||'',note:a[3]||''}));l.d=l.bd.concat(x.d||[])})}
const imgUrl=x=>x&&x.indexOf('photo:')===0?SYNC+'/photo/'+CODE+'/'+x.slice(6)+'.jpg':x;
function setPack(pk){PACK=pk||null;setLessons(famList)}
function isOpen(i){const l=L[i];if(l.x||l.pk||(S.open&&S.open[l.key]))return true;for(let j=PATH.indexOf(i)-1;j>=0;j--){const q=L[PATH[j]];if(l.story||!q.story)return !!S.done[q.key]}return true}
/* A lesson added in the last two weeks is marked new until it is opened or finished. */
const isNew=l=>!!l.at&&Date.now()-l.at<14*864e5&&!S.done[l.key]&&!(S.seenK&&S.seenK[l.key]);
function setLessons(list){
  famList=list||[];L.length=CORE;UNITS.length=NU;try{addTalkWords()}catch(e){}
  L.forEach(l=>{if(!l.bp){l.bp=l.p;l.bd=l.d}l.p=l.bp;l.d=l.bd;l.cards=[]});addPack();
  (list||[]).forEach(x=>L.push({u:4,x:true,at:x.at||0,key:x.id,t:x.t,en:x.en,i:x.i,by:x.by,mine:!!x.mine,p:x.p.map((a,pi)=>PH[x.id+'-'+pi]={id:x.id+'-'+pi,da:a[0],en:a[1],say:a[2]||'',note:a[3]||''}),d:x.d||[],mix:[]}));
  try{localStorage.setItem('hejciera.lessons',JSON.stringify(list||[]))}catch(e){}
}

    const T=(f,at,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+at);g.gain.linearRampToValueAtTime(v||.09,t+at+.012);g.gain.exponentialRampToValueAtTime(.0001,t+at+d);o.connect(g);g.connect(AC.destination);o.start(t+at);o.stop(t+at+d+.03)};
    if(k==='ok'){T(659,0,.13);T(988,.09,.22)}

/* ---------- lesson engine ---------- */
function pool(li){if(li===-3)return [...new Set([...learned(S),...prIds().map(id=>PH[id]),...L[0].p,...L[1].p])];if(li===-2)return L.slice(0,CORE).flatMap(l=>l.p);if(li<0)return learned(S);return L[li].x?[...L[li].p,...learned(S).filter(q=>!q.id.startsWith(L[li].key+'-'))]:L.slice(0,li+1).flatMap(l=>l.p)}
function options(p,li,key,k){const o=sh(pool(li).filter(x=>x[key]!==p[key]&&x.id!==p.id));const pick=[];for(const x of o){if(!pick.some(y=>y[key]===x[key]))pick.push(x);if(pick.length===(k||3))break}return sh([p,...pick])}
function tf(p,li){const truth=Math.random()<.5,o=rnd(pool(li).filter(x=>x.en!==p.en));return {k:'tf',p,truth,shown:truth?p.en:o.en}}
const words=t=>t.replace(/[?!.,]/g,'').split(' ');
/* A phrase is only worth building from tiles when it has at least two different words ("Hej hej" does not). */
const multiWord=p=>new Set(words(p.da).map(x=>x.toLowerCase())).size>=2;
/* Tiles drop the capital on the first word, so the capital does not give the answer away. Names and the Danish "I" keep theirs. */
let PROPER=null;
const proper=()=>{const n=Object.keys(PH).length;if(!PROPER||PROPER.n!==n){PROPER=new Set(Object.values(PH).flatMap(q=>words(q.da).slice(1).filter(x=>/^[A-ZÆØÅ]/.test(x))));PROPER.n=n}return PROPER};
const tw=p=>{const w=words(p.da);if(w[0]!=='I'&&w[0]!==NAME&&!proper().has(w[0]))w[0]=w[0].toLowerCase();return w};
const bankWords=li=>[...new Set(pool(li).flatMap(x=>tw(x)))];
function tileStep(p,li,listen){const w=tw(p),extra=sh(bankWords(li).filter(x=>!w.includes(x))).slice(0,3);return {k:'tiles',listen:!!listen,p,w,bank:sh([...w,...extra])}}
function fillStep(p,li){const w=words(p.da),wi=w.length>1?1+Math.floor(Math.random()*(w.length-1)):0,ans=w[wi],others=sh(bankWords(li).filter(x=>x.toLowerCase()!==ans.toLowerCase())).slice(0,2);
  return {k:'fill',p,gap:w.map((x,i)=>i===wi?'____':x).join(' '),ans,opts:sh([ans,...others])}}
/* Lessons come in three shapes so the order of practice is not the same every time. */
function build(li){
  const l=L[li],P=l.p,sm=!!l.x,teach=[],v=sm?0:li%3;
  for(let c=0;c<P.length;c+=4){const ch=P.slice(c,c+4);
    ch.forEach((p,i)=>{teach.push({k:'learn',p});
      if(i%2===1){const q=ch[i-(Math.random()<.5?1:0)];teach.push(v===1&&multiWord(q)?fillStep(q,li):{k:'hear',p:q,o:options(q,li,'en')})}});
    if(ch.length>=3)teach.push({k:'match',ps:ch});
    sh(ch).slice(0,sm?0:v===2?1:2).forEach(p=>teach.push(tf(p,li)));
  }
  const chat=(l.d||[]).map(t=>{const p=P[t[2]];return {k:'chat',line:{da:t[0],en:t[1]},p,o:options(p,li,'da',2)}});
  const pick=sh(P).slice(0,sm?4:5).map(p=>({k:'pick',p,o:options(p,li,'da')}));
  const multi=sh(P.filter(multiWord));
  const tiles=multi.slice(0,3).map((p,i)=>tileStep(p,li,i%2===1));
  const unfilled=multi.filter(p=>!teach.some(x=>x.k==='fill'&&x.p===p));
  const fill=sm?[]:unfilled.slice(-2).map(p=>fillStep(p,li));
  const mix=(l.mix||[]).map(p=>tileStep(p,li,false));
  const extra=!sm&&multi.length<3?sh(P).slice(0,4).map(p=>tf(p,li)):[];
  const speak=sh(P).slice(0,sm?3:4).map(p=>({k:'speak',p}));
  const blocks=[[chat,pick,tiles,fill,mix],[pick,chat,fill,tiles,mix],[tiles,pick,chat,mix,fill]][v];
  const pics=sm?[]:sh(P.filter(p=>picOf(p))).slice(0,3).map(p=>({k:'pic',p,o:picOpts(p)})).filter(x=>x.o.length===4);
  const out=[...teach,...pics,...blocks.flat(),...extra,...speak];
  if(!(l.cards||[]).length&&PHO.lessons[l.key])out.unshift({k:'card',card:{img:PHO.lessons[l.key][0],t:l.t,c:l.en,credit:PHO.lessons[l.key][1]}});
  (l.cards||[]).forEach((c,i,a)=>out.splice(i?Math.round(i*out.length/a.length):0,0,{k:'card',card:c}));
  return out;
}

  const gain=(15+stars*5+(first?10:0))*(dbl?2:1);
  S.earned+=gain;S.xp+=cur.right;week().xp+=cur.right;if(acc===1)S.perfect++;
  bumpStreak();clearResume();L[li].p.forEach(p=>{if(!S.srs[p.id])S.srs[p.id]={b:1,d:dayNo()+1,miss:0,t:Date.now()}});

  <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}" style="animation-delay:${.25+i*.28}s">★</span>`).join('')}</div>
  <h1>${stars===3?'Fantastisk!':stars===2?'Godt klaret!':'Færdig!'}</h1><p>${esc(L[li].t)} is done${S.streak>1?` · 🔥 ${S.streak} days in a row`:''}</p>
  <div class="stats"><div class="stat" style="--c:var(--candle);animation-delay:1s"><small>Kroner</small><b>🪙 <span data-n="${gain}">0</span></b></div>
  <div class="stat" style="--c:var(--good);animation-delay:1.15s"><small>Right</small><b><span data-n="${Math.round(acc*100)}">0</span>%</b></div>
  <div class="stat" style="--c:var(--blue);animation-delay:1.3s"><small>Best combo</small><b>🔥 <span data-n="${best}">0</span></b></div></div>
  ${scottNote()}

  ${won.length?`<div class="grid" style="width:100%">${won.map(b=>`<div class="tile own new"><i>${b.i}</i><b>${b.t}</b><small>New badge!</small></div>`).join('')}</div>`:''}

function mic(){
  const s=cur.steps[cur.i],st=cur.state;
  if(recog){try{recog.stop()}catch(e){}return}
  if(media){try{media.rec.stop()}catch(e){}return}
  hush();
  if(REC&&!(CODE&&navigator.mediaDevices&&window.MediaRecorder)){
    let got=false;const r=recog=new REC();r.lang='da-DK';r.maxAlternatives=5;r.interimResults=false;
    const miss=()=>{st.tries++;sfx('tap');drawSpeak('again','I didn\'t catch that. Tap and try again.');if(st.tries>=2)allowOn()};
    r.onresult=e=>{got=true;let best=0,heard='';const res=e.results[0];for(let i=0;i<res.length;i++){const v=sim(res[i].transcript,s.p.da);if(v>=best){best=v;heard=res[i].transcript}}
      recog=null;st.tries++;

      else{drawSpeak('again',`I heard "${esc(heard)}". Listen once more and try again.`);if(st.tries>=2)allowOn()}};
    r.onerror=e=>{got=true;recog=null;
      if(e.error==='not-allowed'){drawSpeak('again','The microphone is blocked. Allow it for this page, then tap again.');allowOn()}
      else if(e.error==='language-not-supported'||e.error==='service-not-allowed'||e.error==='network'){REC=null;drawSpeak('idle','Tap to record yourself instead')}
      else miss()};
    r.onend=()=>{if(!got){recog=null;miss()}};
    try{r.start();drawSpeak('live')}catch(e){recog=null;REC=null;drawSpeak('idle','Tap to record yourself instead')}

    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const rec=new MediaRecorder(stream),chunks=[];media={rec,stream};
      rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{clearTimeout(stopT);stream.getTracks().forEach(t=>t.stop());media=null;const blob=new Blob(chunks,{type:rec.mimeType});
        myAudio=new Audio(URL.createObjectURL(blob));if(cur&&cur.steps[cur.i]===s)judge(blob,s,st)};

  }else{drawSpeak('done','This browser can\'t use the microphone. Say it out loud anyway!');allowOn()}
}
/* ---------- grading a recording against the Danish voices ----------
   Both clips become a sequence of sound fingerprints (12 mel cepstral numbers per 10 ms, loudness and
   voice pitch normalized away). The two sequences are time-aligned and the average gap is the score. */
/* Calibrated 2026-11 on the 98 phrases: the same phrase in the other voice scores a gap of 1.8-2.46 (median 2.08),
   a different phrase 1.97-3.1 (median 2.49). Passing is a gap of 2.38 or less, set lenient for a learner. */
const D_GOOD=1.95,D_BAD=2.73,PASS=45;
let scoreOn=true;
const refCache={},refDur={},melCache={};
const decode=ab=>new Promise((res,rej)=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.decodeAudioData(ab,res,rej)});
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}

function melBank(sr,nfft){const key=sr+'/'+nfft;if(melCache[key])return melCache[key];const mel=f=>2595*Math.log10(1+f/700),inv=m=>700*(Math.pow(10,m/2595)-1),N=24,lo=mel(100),hi=mel(4500),pts=[];

  return melCache[key]=fb}
function feats(buf){
  const sr=buf.sampleRate,x=buf.getChannelData(0),win=Math.round(.025*sr),hop=Math.round(.01*sr);let nfft=1;while(nfft<win)nfft<<=1;
  const fb=melBank(sr,nfft),F=[],en=[],re=new Float32Array(nfft),im=new Float32Array(nfft);
  for(let s0=0;s0+win<=x.length;s0+=hop){re.fill(0);im.fill(0);let e=0;
    for(let i=0;i<win;i++){const v=x[s0+i];e+=v*v;re[i]=(v-(i?.97*x[s0+i-1]:0))*(.54-.46*Math.cos(2*Math.PI*i/(win-1)))}
    fft(re,im);const m=fb.map(f=>{let a=0;for(let k=0;k<f.w.length;k++){const q=f.lo+k;a+=(re[q]*re[q]+im[q]*im[q])*f.w[k]}return Math.log(a+1e-10)});
    const c=[];for(let j=1;j<=12;j++){let a=0;for(let q=0;q<m.length;q++)a+=m[q]*Math.cos(Math.PI*j*(q+.5)/m.length);c.push(a)}
    F.push(c);en.push(e/win)}

  let a=en.findIndex(v=>v>pk*.03),b=en.length-1;while(b>a&&en[b]<=pk*.03)b--;

const getClip=k=>getBuf('audio/'+k+'.mp3').catch(()=>getBuf(SYNC+'/audio/'+k+'.mp3'));
function refFeats(text,who){const k=who+'/'+slug(text);return refCache[k]||(refCache[k]=getClip(k).then(decode).then(buf=>{refDur[slug(text)]=buf.duration;return feats(buf)}))}

/* The speech service writes numbers as digits ("2." for "to"), so they are turned back into words before comparing. */
const NUMW={0:'nul',1:'en',2:'to',3:'tre',4:'fire',5:'fem',6:'seks',7:'syv',8:'otte',9:'ni',10:'ti',11:'elleve',12:'tolv',13:'tretten',14:'fjorten',15:'femten',16:'seksten',17:'sytten',18:'atten',19:'nitten',20:'tyve',30:'tredive',40:'fyrre',50:'halvtreds',60:'tres',70:'halvfjerds',80:'firs',90:'halvfems',100:'hundrede'};

function spLog(p,v,pass,svc){if(!p||!p.id)return;S.sp=S.sp||{};const e=S.sp[p.id]||{n:0,f:0,s:0,lo:100};v=Math.round(v)||0;e.n++;if(!pass)e.f++;e.s+=v;e.lo=Math.min(e.lo,v);e.last=v;e.svc=svc?1:0;e.t=Date.now();S.sp[p.id]=e;save()}
async function judge(blob,s,st){

  /* The grader is unreliable on one- and two-word phrases, so after two tries the player may overrule it there. */

  try{
    const buf=await decode(await blob.arrayBuffer()),mine=feats(buf);if(!here())return;st.tries++;
    if(!mine){drawSpeak('again','I could not hear you. Hold the phone a little closer and try again.');if(st.tries>=2)allowOn();return}
    /* First choice: word-by-word pronunciation scoring from the speech service. The sound match below is the backup. */
    let second='';
    if(CODE&&scoreOn){
      try{
        const r=await fetch(SYNC+'/assess/'+CODE+'?t='+encodeURIComponent(s.p.da),{method:'POST',headers:{'content-type':'audio/wav'},body:wavChunks(buf)[0]});

          if(j.ok){

            const miss=w.filter(x=>x.err==='Omission').length,weak=w.filter(x=>x.err!=='Omission'&&x.acc<60).map(x=>esc(x.w)).slice(0,2);

            if(pass)spoke(`${pct} out of 100. ${pct>=85?'Spot on!':weak.length?'Good! Keep working on "'+weak.join('" and "')+'".':'Nicely said!'}`);
            else{
              const msg=(!j.heard||j.heard==='.'?'I could not make out the words. Listen once more and try again.'
                :miss?`${pct} out of 100. I heard "${esc(j.heard)}". Say the whole phrase.`
                :`${pct} out of 100. Work on "${weak.join('" and "')||esc(s.p.da)}". Listen to both, then try again.`);

}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('confetti'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const col=['#ffd23f','#ff5a6e','#a78bfa','#19c2a8','#5fe39a','#4d8dff','#ff8a3d'],P=Array.from({length:80},()=>({x:c.width/2+(Math.random()-.5)*80,y:c.height*.35,vx:(Math.random()-.5)*11,vy:-6-Math.random()*9,w:5+Math.random()*6,r:Math.random()*6,c:rnd(col)}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/130);x.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);x.restore()});
    if(++f<130)requestAnimationFrame(tick);else c.hidden=true})();
}
