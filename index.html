<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hej Ciera">
<title>Hej Ciera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one phone-width column, a bottom tab bar, and a full-screen lesson player.
   Look: the Danish "blue hour" - dusk navy, candle amber, nothing bright. Dark only, on purpose. */
:root{
  color-scheme:dark;
  --bg:#131a26; --surface:#1b2433; --raised:#243044; --line:#2f3c53;
  --fg:#d8d3c6; --muted:#8d95a6;
  --candle:#e3ac5c; --candle-ink:#2a1e0a;
  --good:#7db78c; --good-bg:#1d3329; --miss:#d0787a; --miss-bg:#3a2226;
  --red:#b9474e;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;display:flex;flex-direction:column;gap:18px;
  padding-block:18px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* home */
.hello{display:flex;flex-direction:column;gap:2px}
.hello h1{font-size:30px}
.hello p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.chip small{font-weight:600;color:var(--muted);font-size:12px}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.unit{display:flex;flex-direction:column;gap:10px}
.unit-h{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.unit-h h2{font-size:20px}
.unit-h span{color:var(--muted);font-size:14px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lesson .ico{width:48px;height:48px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:24px;flex:none}
.lesson .tx{flex:1;min-width:0}
.lesson b{font-family:var(--display);font-weight:600;font-size:18px;display:block}
.lesson .tx span{color:var(--muted);font-size:14px}
.lesson .st{font-size:13px;font-weight:700;color:var(--muted);flex:none}
.lesson.next{border-color:var(--candle);background:linear-gradient(180deg,#2a2a2c,#1f2633)}
.lesson.next .st{background:var(--candle);color:var(--candle-ink);padding:7px 14px;border-radius:999px}
.lesson.locked{opacity:.45}
.lesson.done .st{color:var(--candle);letter-spacing:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0f1520;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:10px 4px 9px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:21px;filter:grayscale(.6)}
.tabs button.on{color:var(--candle)}
.tabs button.on i{filter:none}

/* shared */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;background:var(--candle);color:var(--candle-ink);font-family:var(--display);font-weight:600;font-size:18px;text-align:center}
.btn:disabled{background:var(--raised);color:var(--muted)}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn.sm{width:auto;padding:10px 16px;font-size:15px;border-radius:12px}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.tile i{font-style:normal;font-size:32px}
.tile b{font-size:13px;line-height:1.2}
.tile small{color:var(--muted);font-size:12px;line-height:1.25}
.tile.off i{filter:grayscale(1);opacity:.35}
.tile.off b{color:var(--muted)}
.tile.buy{border-color:var(--candle)}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.row .tx{flex:1;min-width:0}
.row b{display:block}
.row span{color:var(--muted);font-size:14px}
.round{width:40px;height:40px;border-radius:50%;background:var(--raised);font-size:18px;flex:none}
.round.on{background:var(--candle);color:var(--candle-ink)}
.stack{display:flex;flex-direction:column;gap:10px}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}

/* lesson player */
.player{flex:1;display:flex;flex-direction:column;min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.pbar .x{font-size:20px;color:var(--muted);width:36px;height:36px}
.track{flex:1;height:10px;border-radius:9px;background:var(--raised);overflow:hidden}
.track div{height:100%;background:var(--candle);border-radius:9px;transition:width .3s}
.step{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:8px 16px}
.ask{color:var(--muted);font-weight:700;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.da{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.15;overflow-wrap:anywhere}
.hint{color:var(--candle);font-size:16px;font-weight:600}
.en{font-size:18px}
.tip{color:var(--muted);font-size:14px;max-width:34ch}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.bigplay{width:96px;height:96px;border-radius:50%;background:var(--raised);border:2px solid var(--candle);font-size:38px;margin:4px auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;font-size:17px;font-weight:600}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--miss);background:var(--miss-bg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .opt{text-align:center;padding:14px 8px;font-size:16px;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--candle)}
.opt.gone{opacity:.3;border-color:var(--good)}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px}
.word.used{opacity:.2}
.mic{width:104px;height:104px;border-radius:50%;background:var(--candle);color:var(--candle-ink);font-size:42px;margin:6px auto;display:block}
.mic.live{background:var(--red);color:#f1dcdc;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(185,71,78,.18)}}
.spk{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.heard{color:var(--muted);font-size:15px}
.foot{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;flex-direction:column;gap:10px}
.fb{border-radius:16px;padding:12px 14px;font-weight:700}
.fb small{display:block;font-weight:600;opacity:.9;font-size:14px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--miss-bg);color:var(--miss)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* finish */
.fin{flex:1;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding-block:24px}
.fin .stars{font-size:44px;letter-spacing:6px;color:var(--candle)}
.fin h1{font-size:34px}
.fin .won{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>
<script>
/* ---------- course content: [Danish, English, say-it hint, note] ---------- */
const UNITS=[
 {t:'Første ord',en:'First words'},
 {t:'Ud i byen',en:'Out and about'},
 {t:'Familie & hygge',en:'Family and cozy times'},
 {t:'På tur',en:'On the trip'}
];
const L=[
 {u:0,t:'Hej!',en:'Hello and goodbye',i:'👋',p:[
  ['Hej','Hi','hi'],
  ['Hej hej','Bye','hi hi','Yes, really. Hello once, goodbye twice.'],
  ['Godmorgen','Good morning','go-MORN'],
  ['Godaften','Good evening','go-AFT-en'],
  ['Godnat','Good night','go-NAT'],
  ['Tak','Thanks','tahk'],
  ['Ja','Yes','ya'],
  ['Nej','No','nigh']]},
 {u:0,t:'Tak!',en:'Being polite',i:'🙏',p:[
  ['Mange tak','Thanks a lot','MAHNG-eh tahk'],
  ['Selv tak','You\'re welcome','sel tahk'],
  ['Undskyld','Sorry / Excuse me','OHN-skool'],
  ['Det er okay','It\'s okay','day air okay'],
  ['Ja tak','Yes, please','ya tahk','Danish has no word for "please". "Tak" does the job.'],
  ['Nej tak','No, thank you','nigh tahk'],
  ['Vi ses','See you','vee SEHS'],
  ['Farvel','Goodbye','fa-VEL']]},
 {u:0,t:'Om mig',en:'About me',i:'🙋‍♀️',p:[
  ['Jeg hedder Ciera','My name is Ciera','yigh HEH-thuh …','The "dd" is soft, like the "th" in "the".'],
  ['Hvad hedder du?','What is your name?','va HEH-thuh doo','The H in "hvad" is silent.'],
  ['Jeg kommer fra USA','I come from the USA','yigh KOM-uh fra oo-ess-ah'],
  ['Hvor kommer du fra?','Where do you come from?','vor KOM-uh doo fra'],
  ['Hyggeligt at møde dig','Nice to meet you','HOO-guh-lit at MUH-thuh digh'],
  ['I lige måde','Likewise','ee LEE-uh MAW-thuh'],
  ['Hvordan går det?','How is it going?','vor-DAN gor day'],
  ['Det går godt','It\'s going well','day gor got']]},
 {u:1,t:'Tal',en:'Numbers 1 to 10',i:'🔢',p:[
  ['en','one','een'],['to','two','toe'],['tre','three','tray'],['fire','four','FEE-uh'],['fem','five','fem'],
  ['seks','six','sex'],['syv','seven','syoo'],['otte','eight','OH-duh'],['ni','nine','nee'],['ti','ten','tee']]},
 {u:1,t:'På café',en:'At the café',i:'☕',p:[
  ['En kaffe, tak','A coffee, please','een KAH-fuh tahk'],
  ['En te, tak','A tea, please','een tay tahk'],
  ['En øl, tak','A beer, please','een ool tahk'],
  ['Et glas vand','A glass of water','et glas van'],
  ['Jeg vil gerne have en kaffe','I would like a coffee','yigh vil GAIR-nuh ha een KAH-fuh','"Jeg vil gerne have …" works for ordering anything.'],
  ['Hvad koster det?','How much is it?','va KOS-tuh day'],
  ['Må jeg betale?','May I pay?','maw yigh be-TAY-luh'],
  ['Med kort','By card','meth kort']]},
 {u:1,t:'Hvad?',en:'When you get stuck',i:'🤔',p:[
  ['Jeg forstår ikke','I don\'t understand','yigh for-STOR IG-uh'],
  ['Taler du engelsk?','Do you speak English?','TAY-luh doo ENG-elsk'],
  ['Jeg taler lidt dansk','I speak a little Danish','yigh TAY-luh lit dansk'],
  ['Kan du sige det igen?','Can you say that again?','ka doo SEE-uh day ee-GEN'],
  ['Langsomt, tak','Slowly, please','LAHNG-somt tahk'],
  ['Hvad betyder det?','What does that mean?','va be-TOO-thuh day'],
  ['Jeg lærer dansk','I am learning Danish','yigh LAIR-uh dansk'],
  ['Jeg ved det ikke','I don\'t know','yigh veth day IG-uh']]},
 {u:2,t:'Familien',en:'Meeting the family',i:'👨‍👩‍👧',p:[
  ['mor','mom','moor'],['far','dad','far'],['søster','sister','SUS-tuh'],['bror','brother','broor'],
  ['min kæreste','my boyfriend / girlfriend','meen KAIR-stuh','Literally "my dearest". Same word for both.'],
  ['Det er min kæreste','This is my boyfriend','day air meen KAIR-stuh'],
  ['Det er min familie','This is my family','day air meen fa-MEEL-yuh'],
  ['Jeg elsker dig','I love you','yigh EL-skuh digh']]},
 {u:2,t:'Hygge',en:'Cozy at the table',i:'🕯️',p:[
  ['Skål!','Cheers!','skawl','Look everyone in the eye when you say it.'],
  ['Det er hyggeligt','This is cozy','day air HOO-guh-lit'],
  ['Tak for mad','Thanks for the meal','tahk for math','Said to the cook after every meal. It will win hearts.'],
  ['Velbekomme','You\'re welcome / Enjoy','VEL-be-kom-uh','The reply to "Tak for mad".'],
  ['Det smager godt','It tastes good','day SMAY-uh got'],
  ['Jeg er sulten','I am hungry','yigh air SOOL-ten'],
  ['Jeg er tørstig','I am thirsty','yigh air TUR-stee'],
  ['Tak for i dag','Thanks for today','tahk for ee day']]},
 {u:2,t:'Mad',en:'Food worth knowing',i:'🥪',p:[
  ['brød','bread','bruth'],['ost','cheese','oost'],['rugbrød','rye bread','ROO-bruth'],
  ['smørrebrød','open-faced sandwich','SMUR-uh-bruth'],['kage','cake','KAY-uh'],['is','ice cream','ees'],
  ['en pølse','a hot dog','een PUL-suh'],
  ['Jeg kan godt lide kage','I like cake','yigh ka got lee KAY-uh']]},
 {u:3,t:'Find vej',en:'Finding your way',i:'🧭',p:[
  ['Hvor er toilettet?','Where is the restroom?','vor air toy-LET-eth'],
  ['Hvor er stationen?','Where is the station?','vor air sta-SHOWN-en'],
  ['Hvor er stranden?','Where is the beach?','vor air STRAN-en'],
  ['til højre','to the right','til HOY-ruh'],
  ['til venstre','to the left','til VEN-struh'],
  ['lige ud','straight ahead','LEE-uh ooth'],
  ['Er det langt?','Is it far?','air day lahngt'],
  ['Det er tæt på','It is close by','day air tet paw']]},
 {u:3,t:'Vejret',en:'Weather small talk',i:'🌦️',p:[
  ['Solen skinner','The sun is shining','SOOL-en SKIN-uh'],
  ['Det regner','It is raining','day RIGH-nuh'],
  ['Det er varmt','It is warm','day air varmt'],
  ['Det er koldt','It is cold','day air kolt'],
  ['Sikke et dejligt vejr','What lovely weather','SIG-uh et DIGH-lit vair'],
  ['i dag','today','ee day'],
  ['i morgen','tomorrow','ee morn'],
  ['God weekend','Have a good weekend','go weekend']]},
 {u:3,t:'Sommerferie',en:'Summer vacation',i:'🏖️',p:[
  ['Vi er på ferie','We are on vacation','vee air paw FAIR-yuh'],
  ['Jeg elsker Danmark','I love Denmark','yigh EL-skuh DAN-mark'],
  ['Vi skal til stranden','We are going to the beach','vee skal til STRAN-en'],
  ['Skal vi cykle?','Shall we bike?','skal vee SOOK-luh'],
  ['Det var sjovt','That was fun','day var shoat'],
  ['Jeg er træt','I am tired','yigh air tret'],
  ['Hav en god dag','Have a nice day','ha een go day'],
  ['Tak for sidst','Thanks for last time','tahk for seest','Said the next time you see someone you had a good time with.']]}
];
L.forEach((l,li)=>l.p=l.p.map((a,pi)=>({id:li+'-'+pi,da:a[0],en:a[1],say:a[2],note:a[3]||''})));

const BADGES=[
 {id:'first',i:'👣',t:'Første skridt',d:'Finish your first lesson',ok:s=>n(s)>=1},
 {id:'u0',i:'👋',t:'Hej-mester',d:'Finish First words',ok:s=>unitDone(s,0)},
 {id:'u1',i:'☕',t:'Café-klar',d:'Finish Out and about',ok:s=>unitDone(s,1)},
 {id:'u2',i:'🕯️',t:'Hygge-ekspert',d:'Finish Family and cozy times',ok:s=>unitDone(s,2)},
 {id:'u3',i:'🧳',t:'Rejseklar',d:'Finish On the trip',ok:s=>unitDone(s,3)},
 {id:'s3',i:'🔥',t:'Tre på stribe',d:'Practice 3 days in a row',ok:s=>s.streak>=3},
 {id:'s7',i:'📅',t:'En hel uge',d:'Practice 7 days in a row',ok:s=>s.streak>=7},
 {id:'sp25',i:'🗣️',t:'Snakkesalig',d:'Say 25 phrases out loud',ok:s=>s.speaks>=25},
 {id:'sp100',i:'⚔️',t:'Vikingestemme',d:'Say 100 phrases out loud',ok:s=>s.speaks>=100},
 {id:'perf',i:'⭐',t:'Fejlfri',d:'A lesson with no mistakes',ok:s=>s.perfect>0},
 {id:'w50',i:'📚',t:'Halvtreds',d:'Learn 50 phrases',ok:s=>learned(s).length>=50},
 {id:'bak3',i:'🍰',t:'Kagekender',d:'Collect 3 pastries',ok:s=>s.bakery.length>=3}
];
const BAKERY=[
 {id:'kanel',i:'🥐',t:'Kanelsnegl',p:30,d:'"Cinnamon snail". The classic.'},
 {id:'flode',i:'🍫',t:'Flødebolle',p:40,d:'Marshmallow cream under a chocolate shell.'},
 {id:'rom',i:'🟤',t:'Romkugle',p:40,d:'A rum ball made from yesterday\'s cakes.'},
 {id:'wiener',i:'🥮',t:'Wienerbrød',p:50,d:'What the world calls "a Danish".'},
 {id:'hind',i:'🍓',t:'Hindbærsnitte',p:60,d:'Raspberry slice with icing and sprinkles.'},
 {id:'drom',i:'🥥',t:'Drømmekage',p:70,d:'"Dream cake" with caramelized coconut.'},
 {id:'aeble',i:'🧆',t:'Æbleskiver',p:80,d:'Round pancake puffs for Christmas.'},
 {id:'krans',i:'🗼',t:'Kransekage',p:120,d:'Marzipan ring tower for New Year\'s.'},
 {id:'lag',i:'🎂',t:'Lagkage',p:150,d:'Layer cake. No birthday without one.'}
];
const PRAISE=[['Flot!','Nice!'],['Super!','Super!'],['Godt klaret!','Well done!'],['Perfekt!','Perfect!'],['Sådan!','That\'s it!'],['Dygtig!','Clever!']];

/* ---------- state ---------- */
const KEY='hejciera.v1';
const def=()=>({kr:0,xp:0,streak:0,lastDay:'',done:{},badges:[],bakery:[],starred:[],speaks:0,perfect:0,trip:''});
let S=def();
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const n=s=>Object.keys(s.done).length;
const unitDone=(s,u)=>L.every((l,i)=>l.u!==u||s.done[i]);
const learned=s=>L.flatMap((l,i)=>s.done[i]?l.p:[]);
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
let tab='home',cur=null;

/* ---------- voice out ---------- */
let voice=null,voicesSeen=false;
function pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();if(v.length){voicesSeen=true;voice=v.find(x=>/^da/i.test(x.lang))||null;if(tab==='home'&&!cur)render()}}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,slow){
  if(!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='da-DK';if(voice)u.voice=voice;u.rate=slow?0.55:0.9;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- voice in ---------- */
let REC=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const norm=s=>s.toLowerCase().replace(/[^a-zæøå0-9 ]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}

/* ---------- screens ---------- */
function render(){
  if(cur){renderStep();return}
  const body={home,rewards,book,me}[tab]();
  app.innerHTML=`<div class="page">${body}</div>
  <nav class="tabs"><div>${[['home','🏠','Learn'],['rewards','🏅','Rewards'],['book','📖','Phrases'],['me','⚙️','Me']]
    .map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</div></nav>`;
}
function daysToTrip(){if(!S.trip)return null;const d=Math.ceil((new Date(S.trip+'T00:00')-new Date())/864e5);return d}
function home(){
  const d=daysToTrip(),hr=new Date().getHours();
  const greet=hr<10?'Godmorgen':hr<18?'Hej':'Godaften';
  const practiced=S.lastDay===dayKey();
  let h=`<div class="hello"><h1>${greet}, Ciera</h1><p>${practiced?'You practiced today. Flot!':'One lesson today, about 20 minutes.'}</p></div>
  <div class="chips"><span class="chip">🔥 ${S.streak} <small>day streak</small></span><span class="chip">🪙 ${S.kr} <small>kroner</small></span>
  ${d!==null&&d>=0?`<span class="chip">🇩🇰 ${d} <small>days to Denmark</small></span>`:''}</div>`;
  if(voicesSeen&&!voice)h+=`<div class="note">This phone has no Danish voice installed, so listening will sound off. Add Danish under text-to-speech in the phone settings, or ask Scott.</div>`;
  UNITS.forEach((u,ui)=>{
    h+=`<section class="unit"><div class="unit-h"><h2>${u.t}</h2><span>${u.en}</span></div>`;
    L.forEach((l,i)=>{if(l.u!==ui)return;
      const dn=S.done[i],open=i===0||S.done[i-1],nx=open&&!dn;
      h+=`<button class="lesson ${dn?'done':nx?'next':open?'':'locked'}" ${open?`data-a="start" data-v="${i}"`:'disabled'}>
      <span class="ico">${l.i}</span><span class="tx"><b>${l.t}</b><span>${l.en}</span></span>
      <span class="st">${dn?'★'.repeat(dn.stars)+'☆'.repeat(3-dn.stars):nx?'Start':'🔒'}</span></button>`});
    h+=`</section>`});
  return h+`<div class="note">More lessons are on the way. Scott adds them as you go.</div>`;
}
function rewards(){
  return `<div class="hello"><h1>Rewards</h1><p>${S.badges.length} of ${BADGES.length} badges · 🪙 ${S.kr} kroner to spend</p></div>
  <section class="unit"><div class="unit-h"><h2>Bageriet</h2><span>The bakery</span></div><div class="grid">${BAKERY.map(b=>{
    const own=S.bakery.includes(b.id),can=S.kr>=b.p;
    return own?`<div class="tile"><i>${b.i}</i><b>${b.t}</b><small>${b.d}</small></div>`
      :`<button class="tile ${can?'buy':'off'}" data-a="buy" data-v="${b.id}" ${can?'':'disabled'}><i>${b.i}</i><b>${b.t}</b><small>🪙 ${b.p}</small></button>`}).join('')}</div></section>
  <section class="unit"><div class="unit-h"><h2>Badges</h2></div><div class="grid">${BADGES.map(b=>{
    const own=S.badges.includes(b.id);return `<div class="tile ${own?'':'off'}"><i>${b.i}</i><b>${b.t}</b><small>${b.d}</small></div>`}).join('')}</div></section>`;
}
function phraseRow(p){const st=S.starred.includes(p.id);
  return `<div class="row"><button class="round" data-a="hear" data-v="${p.id}" aria-label="Listen">🔊</button><div class="tx"><b>${esc(p.da)}</b><span>${esc(p.en)}</span></div>
  <button class="round ${st?'on':''}" data-a="star" data-v="${p.id}" aria-label="Ask Scott about this">?</button></div>`}
function book(){
  const all=L.flatMap(l=>l.p),ask=all.filter(p=>S.starred.includes(p.id));
  let h=`<div class="hello"><h1>Phrases</h1><p>Everything you have learned. Tap ? to save one to ask Scott about.</p></div>`;
  if(ask.length)h+=`<section class="unit"><div class="unit-h"><h2>Spørg Scott</h2><span>Ask Scott</span></div><div class="stack">${ask.map(phraseRow).join('')}</div></section>`;
  const any=L.some((l,i)=>S.done[i]);
  if(!any)h+=`<div class="note">Finish your first lesson and its phrases show up here.</div>`;
  L.forEach((l,i)=>{if(S.done[i])h+=`<section class="unit"><div class="unit-h"><h2>${l.t}</h2><span>${l.en}</span></div><div class="stack">${l.p.map(phraseRow).join('')}</div></section>`});
  return h;
}
function me(){
  return `<div class="hello"><h1>Me</h1><p>${learned(S).length} phrases learned · ${S.speaks} said out loud</p></div>
  <label for="trip">When do you leave for Denmark?<input id="trip" type="date" value="${S.trip}"></label>
  <div class="note">Your progress is saved on this phone only.</div>
  <button class="btn ghost" data-a="reset" id="resetBtn">Start over</button>`;
}

/* ---------- lesson engine ---------- */
function pool(li){return L.slice(0,li+1).flatMap(l=>l.p)}
function options(p,li,key){const o=sh(pool(li).filter(x=>x[key]!==p[key]&&x.id!==p.id));const pick=[];for(const x of o){if(!pick.some(y=>y[key]===x[key]))pick.push(x);if(pick.length===3)break}return sh([p,...pick])}
function build(li){
  const P=L[li].p,st=[];
  for(let c=0;c<P.length;c+=4){const ch=P.slice(c,c+4);
    ch.forEach(p=>st.push({k:'learn',p}));
    if(ch.length>=3)st.push({k:'match',ps:ch});
    sh(ch).forEach(p=>st.push({k:'hear',p,o:options(p,li,'en')}));
    ch.forEach(p=>st.push({k:'speak',p,mode:'read'}));
  }
  sh(P).forEach(p=>st.push({k:'pick',p,o:options(p,li,'da')}));
  sh(P.filter(p=>p.da.split(' ').length>=2)).slice(0,5).forEach(p=>{
    const w=p.da.replace(/[?!.,]/g,'').split(' ');
    const extra=sh(pool(li).flatMap(x=>x.da.replace(/[?!.,]/g,'').split(' ')).filter(x=>!w.includes(x))).slice(0,2);
    st.push({k:'tiles',p,w,bank:sh([...w,...extra])})});
  sh(P).slice(0,4).forEach(p=>st.push({k:'speak',p,mode:'recall'}));
  return st;
}
function start(li){cur={li,steps:build(li),i:0,right:0,graded:0,state:{}};window.scrollTo(0,0);renderStep()}
function renderStep(){
  const s=cur.steps[cur.i],p=s.p;cur.state={};
  let b='',foot=`<button class="btn" data-a="next" id="go" disabled>Continue</button>`;
  if(s.k==='learn'){
    b=`<div class="ask">New phrase</div><div class="card"><div class="da">${esc(p.da)}</div><div class="hint">${esc(p.say)}</div><div class="en">${esc(p.en)}</div>${p.note?`<div class="tip">${esc(p.note)}</div>`:''}
    <div class="acts"><button class="btn sm ghost" data-a="say">🔊 Listen</button><button class="btn sm ghost" data-a="slow">🐢 Slow</button><button class="btn sm ghost" data-a="star" data-v="${p.id}">${S.starred.includes(p.id)?'✓ Saved for Scott':'? Ask Scott'}</button></div></div>`;
    foot=`<button class="btn" data-a="next" id="go">Got it</button>`;
  }else if(s.k==='match'){
    const a=sh(s.ps),e=sh(s.ps);cur.state={left:s.ps.length,miss:false};
    b=`<div class="ask">Match the pairs</div><div class="cols"><div class="opts">${a.map(x=>`<button class="opt" data-a="pair" data-side="da" data-v="${x.id}">${esc(x.da)}</button>`).join('')}</div>
    <div class="opts">${e.map(x=>`<button class="opt" data-a="pair" data-side="en" data-v="${x.id}">${esc(x.en)}</button>`).join('')}</div></div>`;
  }else if(s.k==='hear'){
    b=`<div class="ask">What does this mean?</div><button class="bigplay" data-a="say" aria-label="Play again">🔊</button><div class="acts"><button class="link" data-a="slow">Play it slowly</button></div>
    <div class="opts">${s.o.map(x=>`<button class="opt" data-a="ans" data-v="${x.id}">${esc(x.en)}</button>`).join('')}</div>`;
  }else if(s.k==='pick'){
    b=`<div class="ask">How do you say this in Danish?</div><div class="card"><div class="en">${esc(p.en)}</div></div>
    <div class="opts">${s.o.map(x=>`<button class="opt" data-a="ans" data-v="${x.id}">${esc(x.da)}</button>`).join('')}</div>`;
  }else if(s.k==='tiles'){
    cur.state={picked:[]};
    b=`<div class="ask">Build it in Danish</div><div class="card"><div class="en">${esc(p.en)}</div></div><div class="answer" id="ansrow"></div>
    <div class="bank" id="bank">${s.bank.map((w,i)=>`<button class="word" data-a="word" data-v="${i}">${esc(w)}</button>`).join('')}</div>`;
    foot=`<button class="btn" data-a="check" id="go" disabled>Check</button>`;
  }else if(s.k==='speak'){
    cur.state={tries:0};
    b=s.mode==='read'
      ?`<div class="ask">Say it out loud</div><div class="card"><div class="da">${esc(p.da)}</div><div class="hint">${esc(p.say)}</div><div class="en">${esc(p.en)}</div><div class="acts"><button class="btn sm ghost" data-a="say">🔊 Listen</button><button class="btn sm ghost" data-a="slow">🐢 Slow</button></div></div>`
      :`<div class="ask">From memory: say it in Danish</div><div class="card"><div class="en">${esc(p.en)}</div><div class="da" id="peek" hidden>${esc(p.da)}</div><div class="acts"><button class="btn sm ghost" data-a="peek">👀 Peek</button></div></div>`;
    b+=`<div class="spk" id="spk"></div>`;
    foot=`<button class="btn" data-a="next" id="go" disabled>Continue</button><button class="link" data-a="skipspeak">I can't talk right now</button>`;
  }
  app.innerHTML=`<div class="player"><div class="pbar"><button class="x" data-a="quit" aria-label="Leave lesson">✕</button><div class="track"><div style="width:${cur.i/cur.steps.length*100}%"></div></div></div>
  <div class="step">${b}</div><div class="foot"><div id="fb"></div>${foot}</div></div>`;
  if(s.k==='learn'||s.k==='hear')say(p.da);
  if(s.k==='speak')drawSpeak('idle');
}
function grade(ok,s,quiet){
  if(!s.retry){cur.graded++;if(ok)cur.right++}
  if(!ok&&!s.retry)cur.steps.push(Object.assign({},s,{retry:true}));
  const pr=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb=document.getElementById('fb');
  fb.innerHTML=ok?`<div class="fb ok">${pr[0]} <small>${pr[1]}</small></div>`
    :`<div class="fb no">Næsten! <small>Almost. It's "${esc(s.p?s.p.da:'')}" = ${esc(s.p?s.p.en:'')}. You'll see it again.</small></div>`;
  const go=document.getElementById('go');go.disabled=false;go.dataset.a='next';go.textContent='Continue';
  if(!quiet&&s.p)say(s.p.da);
}
function next(){
  try{speechSynthesis.cancel()}catch(e){}stopRec();
  cur.i++;if(cur.i>=cur.steps.length)return finish();window.scrollTo(0,0);renderStep();
}
function finish(){
  const li=cur.li,acc=cur.graded?cur.right/cur.graded:1,stars=acc>=.9?3:acc>=.7?2:1,first=!S.done[li];
  const kr=15+stars*5+(first?10:0);
  S.kr+=kr;S.xp+=cur.right;if(acc===1)S.perfect++;
  const t=dayKey(),y=dayKey(new Date(Date.now()-864e5));
  if(S.lastDay!==t){S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t}
  S.done[li]={stars:Math.max(stars,S.done[li]?S.done[li].stars:0)};
  const won=BADGES.filter(b=>!S.badges.includes(b.id)&&b.ok(S));won.forEach(b=>S.badges.push(b.id));
  save();cur=null;tab='home';
  app.innerHTML=`<div class="page"><div class="fin"><div class="stars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><h1>${stars===3?'Fantastisk!':stars===2?'Godt klaret!':'Færdig!'}</h1>
  <p>${esc(L[li].t)} is done. ${Math.round(acc*100)}% right on the first try.</p>
  <div class="won"><span class="chip">🪙 +${kr} <small>kroner</small></span><span class="chip">🔥 ${S.streak} <small>day streak</small></span></div>
  ${won.length?`<div class="grid" style="width:100%">${won.map(b=>`<div class="tile"><i>${b.i}</i><b>${b.t}</b><small>New badge!</small></div>`).join('')}</div>`:''}
  <button class="btn" data-a="tab" data-v="home">Continue</button><button class="link" data-a="tab" data-v="rewards">Spend kroner at the bakery</button></div></div>`;
  confetti();
}

/* ---------- speaking ---------- */
let recog=null,media=null,myAudio=null;
function stopRec(){try{recog&&recog.abort()}catch(e){}recog=null;try{media&&media.rec.state!=='inactive'&&media.rec.stop();media&&media.stream.getTracks().forEach(t=>t.stop())}catch(e){}media=null}
function drawSpeak(mode,msg){
  const el=document.getElementById('spk');if(!el)return;
  const mic=(live)=>`<button class="mic ${live?'live':''}" data-a="mic" aria-label="${live?'Stop':'Speak'}">${live?'■':'🎤'}</button>`;
  if(mode==='idle')el.innerHTML=mic(false)+`<div class="heard">${msg||'Tap the mic and say it'}</div>`;
  else if(mode==='live')el.innerHTML=mic(true)+`<div class="heard">${msg||'Listening…'}</div>`;
  else if(mode==='again')el.innerHTML=mic(false)+`<div class="heard">${msg}</div>`;
  else if(mode==='review')el.innerHTML=`<div class="heard">Listen to yourself, then to the Danish. Close enough?</div><div class="acts"><button class="btn sm ghost" data-a="mine">▶ Me</button><button class="btn sm ghost" data-a="say">🔊 Danish</button></div>
    <div class="acts"><button class="btn sm ghost" data-a="mic">Try again</button><button class="btn sm" data-a="selfok">Sounds good</button></div>`;
  else if(mode==='done')el.innerHTML=`<div class="heard">${msg||''}</div>`;
}
function spoke(msg){S.speaks++;save();drawSpeak('done',msg);grade(true,cur.steps[cur.i],true);const pk=document.getElementById('peek');if(pk)pk.hidden=false}
function mic(){
  const s=cur.steps[cur.i],st=cur.state;
  if(recog){try{recog.stop()}catch(e){}return}
  if(media){try{media.rec.stop()}catch(e){}return}
  try{speechSynthesis.cancel()}catch(e){}
  if(REC){
    let got=false;const r=recog=new REC();r.lang='da-DK';r.maxAlternatives=5;r.interimResults=false;
    r.onresult=e=>{got=true;let best=0,heard='';const res=e.results[0];for(let i=0;i<res.length;i++){const v=sim(res[i].transcript,s.p.da);if(v>=best){best=v;heard=res[i].transcript}}
      recog=null;st.tries++;
      if(best>=.75)spoke(`I heard "${esc(heard)}". Spot on.`);
      else if(best>=.5)spoke(`I heard "${esc(heard)}". Close enough to be understood!`);
      else{drawSpeak('again',`I heard "${esc(heard)}". Listen once more and try again.`);if(st.tries>=2)allowOn()}};
    r.onerror=e=>{got=true;recog=null;
      if(e.error==='not-allowed'||e.error==='service-not-allowed'&&!st.denied){st.denied=true;drawSpeak('again','The microphone is blocked. Allow it for this page, then tap again.');allowOn()}
      else if(e.error==='language-not-supported'||e.error==='service-not-allowed'||e.error==='network'){REC=null;drawSpeak('idle','Tap to record yourself instead')}
      else{st.tries++;drawSpeak('again','I didn\'t catch that. Tap and try again.');if(st.tries>=2)allowOn()}};
    r.onend=()=>{if(!got){recog=null;st.tries++;drawSpeak('again','I didn\'t catch that. Tap and try again.');if(st.tries>=2)allowOn()}};
    try{r.start();drawSpeak('live')}catch(e){recog=null;REC=null;drawSpeak('idle','Tap to record yourself instead')}
  }else if(navigator.mediaDevices&&window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const rec=new MediaRecorder(stream),chunks=[];media={rec,stream};
      rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());media=null;myAudio=new Audio(URL.createObjectURL(new Blob(chunks,{type:rec.mimeType})));drawSpeak('review');myAudio.play().catch(()=>{})};
      rec.start();drawSpeak('live','Recording… tap to stop');
    }).catch(()=>{drawSpeak('again','The microphone is blocked. Allow it for this page, then tap again.');allowOn()});
  }else{drawSpeak('done','This browser can\'t use the microphone. Say it out loud anyway!');allowOn()}
}
function allowOn(){const go=document.getElementById('go');if(go){go.disabled=false;go.textContent='Continue anyway'}}

/* ---------- actions ---------- */
const byId=id=>L.flatMap(l=>l.p).find(p=>p.id===id);
const A={
  tab(el){tab=el.dataset.v;window.scrollTo(0,0);render()},
  start(el){start(+el.dataset.v)},
  quit(){stopRec();try{speechSynthesis.cancel()}catch(e){}cur=null;render()},
  say(){say(cur.steps[cur.i].p.da)},
  slow(){say(cur.steps[cur.i].p.da,true)},
  hear(el){say(byId(el.dataset.v).da)},
  peek(){document.getElementById('peek').hidden=false},
  star(el){const id=el.dataset.v,i=S.starred.indexOf(id);i<0?S.starred.push(id):S.starred.splice(i,1);save();
    if(cur)el.textContent=i<0?'✓ Saved for Scott':'? Ask Scott';else render()},
  next,
  ans(el){const s=cur.steps[cur.i];if(cur.state.done)return;cur.state.done=true;
    const ok=el.dataset.v===s.p.id;el.classList.add(ok?'ok':'no');
    if(!ok)document.querySelector(`.opt[data-v="${s.p.id}"]`).classList.add('ok');grade(ok,s)},
  pair(el){const st=cur.state,s=cur.steps[cur.i];if(el.classList.contains('gone'))return;
    if(el.dataset.side==='da')say(byId(el.dataset.v).da);
    if(!st.sel||st.sel.dataset.side===el.dataset.side){st.sel&&st.sel.classList.remove('sel');st.sel=el;el.classList.add('sel');return}
    const a=st.sel;st.sel=null;a.classList.remove('sel');
    if(a.dataset.v===el.dataset.v){a.classList.add('gone');el.classList.add('gone');if(--st.left===0){cur.graded++;if(!st.miss)cur.right++;
      document.getElementById('fb').innerHTML=`<div class="fb ok">Flot! <small>All matched.</small></div>`;document.getElementById('go').disabled=false}}
    else{st.miss=true;[a,el].forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),320)})}},
  word(el){const st=cur.state,s=cur.steps[cur.i];if(st.done||el.classList.contains('used'))return;
    el.classList.add('used');st.picked.push(+el.dataset.v);drawTiles(s)},
  unword(el){const st=cur.state,s=cur.steps[cur.i];if(st.done)return;const i=+el.dataset.v;
    st.picked=st.picked.filter(x=>x!==i);document.querySelector(`#bank .word[data-v="${i}"]`).classList.remove('used');drawTiles(s)},
  check(){const s=cur.steps[cur.i],st=cur.state;st.done=true;grade(st.picked.map(i=>s.bank[i]).join(' ')===s.w.join(' '),s)},
  mic,
  mine(){myAudio&&myAudio.play().catch(()=>{})},
  selfok(){spoke('Godt! Saying it out loud is the whole trick.')},
  skipspeak(){next()},
  buy(el){const b=BAKERY.find(x=>x.id===el.dataset.v);if(S.kr<b.p||S.bakery.includes(b.id))return;S.kr-=b.p;S.bakery.push(b.id);
    BADGES.forEach(x=>{if(!S.badges.includes(x.id)&&x.ok(S))S.badges.push(x.id)});save();render();confetti()},
  reset(el){if(el.dataset.sure){S=def();save();render()}else{el.dataset.sure=1;el.textContent='Tap again to erase all progress'}}
};
function drawTiles(s){const st=cur.state;
  document.getElementById('ansrow').innerHTML=st.picked.map(i=>`<button class="word" data-a="unword" data-v="${i}">${esc(s.bank[i])}</button>`).join('');
  document.getElementById('go').disabled=!st.picked.length}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('change',e=>{if(e.target.id==='trip'){S.trip=e.target.value;save()}});

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('confetti'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const col=['#e3ac5c','#b9474e','#d8d3c6','#7db78c'],P=Array.from({length:70},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*3,w:5+Math.random()*5,r:Math.random()*6,c:col[Math.floor(Math.random()*4)]}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x+Math.sin(p.r)*12,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=.85;x.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);x.restore()});
    if(++f<150)requestAnimationFrame(tick);else c.hidden=true})();
}
render();
</script>
